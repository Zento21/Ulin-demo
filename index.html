<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>友邻 YouLin — 本地素人互免探店平台</title>
<style>
  :root {
    --green: #16a34a; --green-dark: #15803d; --green-light: #dcfce7;
    --orange: #f97316; --orange-light: #ffedd5;
    --bg: #f6f7f6; --text: #1f2937; --text2: #6b7280; --divider: #eceff1;
    --blue: #3b82f6; --red: #ef4444;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #eef2ee 0%, #e4ebe4 100%);
    color: var(--text); min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; padding: 28px 16px 48px;
  }
  .intro { text-align: center; margin-bottom: 20px; }
  .intro h1 { font-size: 20px; font-weight: 800; letter-spacing: .5px; }
  .intro h1 span { color: var(--green); }
  .intro p { font-size: 13px; color: var(--text2); margin-top: 6px; }
  .intro .line { margin-top: 8px; font-size: 12px; color: #9ca3af; letter-spacing: .3px; }

  .phone {
    width: 392px; max-width: 100%; height: 830px; background: var(--bg);
    border-radius: 40px; border: 10px solid #111827; overflow: hidden;
    display: flex; flex-direction: column; position: relative;
    box-shadow: 0 30px 60px rgba(16,24,40,.25);
  }
  .appbar { background: #fff; padding: 14px 16px 12px; display: flex; align-items: center; gap: 10px; box-shadow: 0 1px 0 rgba(16,24,40,.06); z-index: 5; }
  .logo { width: 30px; height: 30px; border-radius: 10px; color: #fff; font-size: 16px; font-weight: 800; background: linear-gradient(135deg, #22c55e, var(--green)); display: flex; align-items: center; justify-content: center; }
  .appbar h2 { font-size: 18px; font-weight: 800; flex: 1; }
  .bell { position: relative; width: 30px; height: 30px; border-radius: 50%; background: var(--bg); display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .bell::before { content: "🔔"; font-size: 14px; }
  .bell i { position: absolute; top: -2px; right: -2px; width: 15px; height: 15px; border-radius: 50%; background: var(--red); color: #fff; font-size: 9px; font-style: normal; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .uname { font-size: 12px; color: var(--text2); max-width: 72px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .page { flex: 1; overflow-y: auto; padding: 16px 14px 90px; }
  .page::-webkit-scrollbar { display: none; }

  .tabbar { position: absolute; bottom: 0; left: 0; right: 0; height: 62px; background: #fff; display: flex; box-shadow: 0 -1px 0 var(--divider); z-index: 5; }
  .tabbar button { flex: 1; border: 0; background: none; font-size: 11px; color: #9ca3af; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; font-family: inherit; padding-top: 9px; }
  .tabbar button .ico { font-size: 20px; line-height: 1; filter: grayscale(1) opacity(.55); }
  .tabbar button.on { color: var(--green); font-weight: 700; }
  .tabbar button.on .ico { filter: none; }

  .h { font-size: 19px; font-weight: 800; }
  .sub { font-size: 12px; color: var(--text2); }

  /* ---- 登录页 ---- */
  .login { flex: 1; overflow-y: auto; padding: 64px 30px 30px; background: #fff; }
  .login .hero { text-align: center; margin-bottom: 36px; }
  .login .hero .biglogo { width: 84px; height: 84px; margin: 0 auto 14px; border-radius: 26px; background: linear-gradient(135deg, #22c55e, var(--green)); color: #fff; font-size: 42px; font-weight: 800; line-height: 84px; box-shadow: 0 10px 26px rgba(22,163,74,.28); }
  .login .hero h3 { font-size: 24px; font-weight: 800; letter-spacing: 2px; }
  .login .hero p { font-size: 12px; color: var(--text2); margin-top: 8px; }
  .seg { display: flex; background: var(--bg); border-radius: 999px; padding: 4px; margin-bottom: 20px; }
  .seg button { flex: 1; border: 0; background: none; font-family: inherit; font-size: 14px; color: var(--text2); padding: 10px 0; border-radius: 999px; cursor: pointer; font-weight: 600; }
  .seg button.on { background: #fff; color: var(--green); font-weight: 800; box-shadow: 0 1px 4px rgba(16,24,40,.1); }
  .field { display: flex; align-items: center; border: 1px solid #e5e7eb; border-radius: 14px; padding: 0 14px; margin-bottom: 14px; height: 50px; }
  .field input { flex: 1; border: 0; outline: 0; font-size: 15px; font-family: inherit; }
  .field .send { border: 0; background: none; color: var(--green); font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .field .send[disabled] { color: #c0c4cc; }
  .btn-login { width: 100%; height: 50px; border: 0; border-radius: 999px; color: #fff; font-size: 16px; font-weight: 800; letter-spacing: 4px; cursor: pointer; font-family: inherit; background: linear-gradient(135deg, #22c55e, var(--green)); box-shadow: 0 8px 20px rgba(22,163,74,.28); }
  .login .or { display: flex; align-items: center; gap: 14px; margin: 24px 0; }
  .login .or::before, .login .or::after { content: ""; flex: 1; height: 1px; background: var(--divider); }
  .login .or span { font-size: 11px; color: #c0c4cc; }
  .btn-wechat { width: 100%; height: 48px; border: 1px solid var(--green); border-radius: 999px; color: var(--green); font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; background: var(--green-light); }
  .agree { text-align: center; font-size: 11px; color: #c0c4cc; margin-top: 22px; line-height: 1.8; }
  .agree b { color: var(--text2); font-weight: 400; }
  .role-note { margin-top: 18px; text-align: center; font-size: 11px; color: #b0b6bd; line-height: 1.7; }

  /* ---- 筛选 chips / 瀑布流 ---- */
  .chips { display: flex; gap: 8px; overflow-x: auto; margin: 12px -14px 0; padding: 2px 14px 6px; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; font-size: 12px; color: var(--text2); background: #fff; border: 1px solid #e5e7eb; border-radius: 999px; padding: 6px 14px; cursor: pointer; }
  .chip.on { background: var(--green); border-color: var(--green); color: #fff; font-weight: 700; }
  .chip.sep { flex-basis: 1px; border: 0; padding: 0; background: var(--divider); }
  .waterfall { column-count: 2; column-gap: 10px; margin-top: 12px; }
  .card { break-inside: avoid; background: #fff; border-radius: 14px; overflow: hidden; margin-bottom: 10px; box-shadow: 0 1px 3px rgba(16,24,40,.07); cursor: pointer; transition: transform .25s ease, opacity .25s ease; }
  .card.gone { transform: scale(.7); opacity: 0; }
  .cover { position: relative; display: flex; align-items: center; justify-content: center; }
  .cover .emoji { font-size: 42px; }
  .badge-v { position: absolute; top: 8px; left: 8px; background: rgba(249,115,22,.94); color: #fff; font-size: 11px; font-weight: 800; padding: 3px 10px; border-radius: 999px; }
  .badge-d { position: absolute; bottom: 8px; right: 8px; background: rgba(255,255,255,.94); color: var(--green); font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
  .cbody { padding: 10px 12px 12px; }
  .cname { font-size: 14px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cdesc { font-size: 11px; color: var(--text2); line-height: 1.5; height: 33px; overflow: hidden; margin-top: 3px; }
  .metas { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .meta { font-size: 10px; color: var(--text2); border: 1px solid #e5e7eb; border-radius: 999px; padding: 2px 8px; }
  .btn-accept { margin-top: 10px; width: 100%; border: 0; cursor: pointer; color: #fff; font-family: inherit; font-size: 13px; font-weight: 800; letter-spacing: 2px; padding: 9px 0; border-radius: 999px; background: linear-gradient(135deg, #22c55e, var(--green)); box-shadow: 0 4px 10px rgba(22,163,74,.25); }
  .btn-accept:active { filter: brightness(.95); transform: scale(.98); }

  /* ---- 订单 ---- */
  .ocards { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
  .ocard { background: #fff; border-radius: 14px; padding: 14px; box-shadow: 0 1px 3px rgba(16,24,40,.06); }
  .otop { display: flex; justify-content: space-between; align-items: center; }
  .oname { font-size: 15px; font-weight: 700; }
  .ost { font-size: 11px; padding: 3px 10px; border-radius: 999px; font-weight: 700; }
  .st-accepted { color: var(--blue); background: #dbeafe; }
  .st-checked { color: var(--green); background: var(--green-light); }
  .st-note { color: var(--orange); background: var(--orange-light); }
  .st-done { color: #fff; background: var(--green); }
  .st-redeem { color: var(--orange); background: var(--orange-light); }
  .odesc { font-size: 12px; color: var(--text2); margin-top: 5px; }
  .obottom { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
  .oval { color: var(--orange); font-weight: 800; font-size: 13px; background: var(--orange-light); border-radius: 999px; padding: 3px 10px; }
  .btn-act { border: 0; cursor: pointer; font-family: inherit; color: #fff; font-size: 12px; font-weight: 700; padding: 8px 16px; border-radius: 999px; background: linear-gradient(135deg, #22c55e, var(--green)); }
  .btn-act.ghost { color: var(--green); background: #fff; border: 1px solid var(--green); }
  .btn-act[disabled] { opacity: .6; }
  .who { font-size: 11px; color: var(--text2); margin-top: 6px; }
  .who b { color: var(--text); font-weight: 600; }

  /* ---- 我的（达人） ---- */
  .profile { background: #fff; border-radius: 18px; padding: 20px; text-align: center; box-shadow: 0 1px 3px rgba(16,24,40,.06); margin-top: 14px; }
  .avatar { width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 10px; background: linear-gradient(135deg, #fbbf24, var(--orange)); color: #fff; font-size: 26px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .ring { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; background: var(--green-light); color: var(--green-dark); font-size: 12px; font-weight: 700; padding: 5px 14px; border-radius: 999px; }
  .stats { display: flex; margin-top: 14px; background: #fff; border-radius: 18px; padding: 14px 0; box-shadow: 0 1px 3px rgba(16,24,40,.06); }
  .stat { flex: 1; text-align: center; }
  .stat b { font-size: 18px; display: block; }
  .stat span { font-size: 11px; color: var(--text2); }
  .stat + .stat { border-left: 1px solid var(--divider); }
  .notes { background: #fff; border-radius: 18px; padding: 16px; box-shadow: 0 1px 3px rgba(16,24,40,.06); margin-top: 14px; }
  .notes .nt { font-size: 14px; font-weight: 700; margin-bottom: 10px; }
  .note { border: 1px solid var(--divider); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; }
  .note .nrow { display: flex; justify-content: space-between; align-items: center; }
  .note .nname { font-size: 13px; font-weight: 600; }
  .comp { font-size: 10px; color: var(--red); border: 1px solid #fecaca; background: #fef2f2; border-radius: 6px; padding: 1px 6px; font-weight: 700; }
  .note .nsub { font-size: 11px; color: var(--text2); margin-top: 4px; }
  .menu { background: #fff; border-radius: 18px; margin-top: 14px; box-shadow: 0 1px 3px rgba(16,24,40,.06); overflow: hidden; }
  .mi { display: flex; align-items: center; justify-content: space-between; padding: 15px 16px; font-size: 14px; cursor: pointer; border-bottom: 1px solid #f6f7f6; }
  .mi:last-child { border-bottom: 0; }
  .mi .l { display: flex; align-items: center; gap: 10px; }
  .mi .arr { color: #c0c4cc; }

  /* ---- 工作台（商家） ---- */
  .hi { margin-top: 2px; }
  .hi .h + .sub { margin-top: 4px; }
  .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .metric { background: #fff; border-radius: 14px; padding: 14px; box-shadow: 0 1px 3px rgba(16,24,40,.06); }
  .metric b { font-size: 22px; }
  .metric span { font-size: 11px; color: var(--text2); display: block; margin-top: 2px; }
  .metric em { font-style: normal; font-size: 10px; color: var(--green); font-weight: 700; }
  .chart { background: #fff; border-radius: 14px; padding: 14px; margin-top: 10px; box-shadow: 0 1px 3px rgba(16,24,40,.06); }
  .chart .ct { font-weight: 700; font-size: 13px; }
  .bars { display: flex; align-items: flex-end; gap: 8px; height: 80px; margin-top: 12px; }
  .bar { flex: 1; border-radius: 6px 6px 2px 2px; background: linear-gradient(180deg, #22c55e, var(--green)); position: relative; }
  .bar span { position: absolute; bottom: -16px; left: 0; right: 0; text-align: center; font-size: 9px; color: var(--text2); }
  .pubcard { margin-top: 14px; background: linear-gradient(135deg, #22c55e, var(--green)); border-radius: 16px; padding: 18px; color: #fff; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 8px 18px rgba(22,163,74,.25); cursor: pointer; }
  .pubcard .t { font-size: 16px; font-weight: 800; }
  .pubcard .s { font-size: 11px; opacity: .9; margin-top: 4px; }
  .pubcard .go { background: #fff; color: var(--green); font-size: 13px; font-weight: 800; border-radius: 999px; padding: 9px 18px; }
  .sec { margin-top: 16px; }
  .sec .st { font-size: 15px; font-weight: 800; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: baseline; }
  .sec .st span { font-size: 11px; color: var(--text2); font-weight: 400; }

  /* ---- 店铺我的（商家） ---- */
  .store { background: #fff; border-radius: 18px; padding: 18px; display: flex; gap: 14px; align-items: center; box-shadow: 0 1px 3px rgba(16,24,40,.06); margin-top: 14px; }
  .store .slogo { width: 58px; height: 58px; border-radius: 14px; background: linear-gradient(135deg, #d1fae5, #a7f3d0); display: flex; align-items: center; justify-content: center; font-size: 28px; }
  .store .verified { font-size: 10px; color: var(--blue); background: #dbeafe; border-radius: 6px; padding: 2px 6px; font-weight: 700; margin-left: 6px; }

  .toast { position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%) translateY(10px); background: rgba(17,24,39,.92); color: #fff; font-size: 13px; padding: 10px 18px; border-radius: 999px; opacity: 0; transition: all .25s ease; pointer-events: none; z-index: 20; white-space: nowrap; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .mask { position: absolute; inset: 0; background: rgba(17,24,39,.45); z-index: 30; display: none; align-items: flex-end; }
  .mask.show { display: flex; }
  .sheet { background: #fff; border-radius: 22px 22px 0 0; padding: 20px 18px 26px; width: 100%; animation: up .22s ease; }
  @keyframes up { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }
  .sheet .sh { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .sheet .sh b { font-size: 16px; }
  .sheet .sh .x { color: #c0c4cc; font-size: 20px; cursor: pointer; padding: 2px 6px; }
  .frow { margin-bottom: 12px; }
  .frow label { font-size: 12px; color: var(--text2); display: block; margin-bottom: 6px; }
  .frow input, .frow textarea { width: 100%; border: 1px solid #e5e7eb; border-radius: 12px; padding: 10px 12px; font-size: 14px; font-family: inherit; outline: none; }
  .frow textarea { height: 64px; resize: none; }

  .hint { margin-top: 18px; font-size: 11px; color: #b8bec4; text-align: center; line-height: 1.8; }
</style>
</head>
<body>

<div class="intro">
  <h1>友邻 <span>YouLin</span> · 本地素人互免探店平台</h1>
  <p>商家发免费体验单 → 素人 LBS 到店核验 → 强制合规标注笔记 → 数据回流看板</p>

function openSheet(html) {

/* ================= 登录页 ================= */
function renderLogin() {
  $phone.innerHTML = `

    <div class="field"><input value="138 **** 6666" readonly /><button class="send" onclick="sendCode()" id="sendBtn">获取验证码</button></div>

    <button class="btn-login" onclick="doLogin()">${loginRole === "amateur" ? "登录 / 注册" : "登录商家后台"}</button>
    <div class="or"><span>其他方式</span></div>
    <button class="btn-wechat" onclick="wechatLogin()">微信一键登录</button>
    <div class="role-note">${loginRole === "amateur"
      ? "🧭 达人端：发现附近免费体验 → 到店核验 → 发布合规笔记赚信用"
      : "🏪 商家端：发布体验单 → 双精准匹配达人 → 核销看数据"}</div>
    <div class="agree">登录即代表同意 <b>《用户协议》</b> 与 <b>《隐私政策》</b><br/>未注册的手机号将自动创建账号</div>
  </div>
  <div class="toast" id="toast"></div>
  <div class="mask" id="mask" onclick="closeSheet()"><div class="sheet" id="sheet" onclick="event.stopPropagation()"></div></div>`;
}
function setLoginRole(r) { loginRole = r; renderLogin(); }
function sendCode() {
  if (countdown > 0) return;
  countdown = 60;
  toast("验证码已发送，请注意查收");
  cdTimer = setInterval(() => {
    countdown--;
    const b = document.getElementById("sendBtn");
    if (!b) { clearInterval(cdTimer); return; }
    if (countdown <= 0) { clearInterval(cdTimer); b.textContent = "获取验证码"; b.disabled = false; }
    else { b.textContent = countdown + "s"; b.disabled = true; }
  }, 1000);
}
function doLogin() {
  const code = (document.getElementById("codeInput") || {}).value || "";
  if (!code.trim()) { toast("请输入验证码（任意数字）"); return; }
  enterApp(loginRole);
}
function wechatLogin() { enterApp(loginRole, true); }
function enterApp(r, wechat) {
  role = r; tab = 0;
  toast(wechat ? "微信登录成功" : (r === "amateur" ? "欢迎回来，阿布" : "商家后台已登录"));
  renderApp();
}
function logout() { role = null; mine = []; pool = ORDERS.slice(); renderLogin(); }
function switchRole() { loginRole = role === "amateur" ? "merchant" : "amateur"; role = null; renderLogin(); toast("已切换身份，请重新登录"); }

/* ================= App 外壳 ================= */
function renderApp() {
  const amateur = role === "amateur";
  const tabs = amateur
    ? [["🧭", "发现"], ["🧾", "订单"], ["👤", "我的"]]
    : [["🏪", "工作台"], ["🧾", "订单"], ["👤", "我的"]];
  const titles = amateur ? ["友邻", "我的订单", "我的"] : ["友邻 · 商家", "订单管理", "店铺与设置"];
  $phone.innerHTML = `
    <div class="appbar">
      <div class="logo">友</div>
      <h2 id="barTitle">${titles[tab]}</h2>
      <div class="bell" onclick="toast('${amateur ? "2 条新消息：接单成功 · 核验通过" : "1 条新消息：新达人接单"}')"><i>${amateur ? 2 : 1}</i></div>
      <div class="uname">${amateur ? "阿布" : "半糖时光"}</div>
    </div>
    <div class="page" id="page"></div>
    <div class="tabbar" id="tabbar">
      ${tabs.map((t, i) => `<button class="${i === tab ? "on" : ""}" data-i="${i}" onclick="goTab(${i})"><span class="ico">${t[0]}</span>${t[1]}</button>`).join("")}
    </div>
    <div class="toast" id="toast"></div>
    <div class="mask" id="mask" onclick="closeSheet()"><div class="sheet" id="sheet" onclick="event.stopPropagation()"></div></div>`;
  (amateur ? [renderDiscover, renderOrders, renderAmateurProfile] : [renderWorkbench, renderMerchantOrders, renderMerchantProfile])[tab]();
}
function goTab(i) {
  tab = i;
  const titles = role === "amateur" ? ["友邻", "我的订单", "我的"] : ["友邻 · 商家", "订单管理", "店铺与设置"];
  document.querySelectorAll(".tabbar button").forEach(b => b.classList.toggle("on", +b.dataset.i === i));
  document.getElementById("barTitle").textContent = titles[i];
  (role === "amateur" ? [renderDiscover, renderOrders, renderAmateurProfile] : [renderWorkbench, renderMerchantOrders, renderMerchantProfile])[i]();
}

/* ================= 达人 · 发现 ================= */
let radiusOn = "5km";
function renderDiscover() {
  document.getElementById("page").innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:baseline;">

    </div>

      <span class="chip on">全部圈层</span>
    </div>
    ${pool.length ? `<div class="waterfall">${pool.map((o, i) => `
      <div class="card" id="card-${o.id}">
        <div class="cover" style="height:${120 + (i % 3) * 24}px;background:${GRADS[o.grad]}">
          <span class="emoji">${o.emoji}</span>

          <div class="cname">${o.name}</div>

          <button class="btn-accept" onclick="accept(event,${o.id})">免费领取</button>
        </div>
      </div>`).join("")}</div>`
    : `<div style="text-align:center;padding:120px 0;color:var(--text2)"><div style="font-size:44px">🍽️</div><p style="margin-top:10px">附近暂无可领体验单</p></div>`}`;
}
function setRadius(r) { radiusOn = r; toast(`已切换到 ${r} 范围`); renderDiscover(); }
function accept(e, id) {
  e.stopPropagation();
  const idx = pool.findIndex(o => o.id === id);
  const [o] = pool.splice(idx, 1);
  mine.unshift({ o, st: "accepted" });
  const el = document.getElementById("card-" + id);
  if (el) { el.classList.add("gone"); setTimeout(() => { if (tab === 0 && role === "amateur") renderDiscover(); }, 260); }
  toast("领取成功！记得按时到店核验");
}

/* ================= 达人 · 订单 ================= */
const ST_TEXT = { accepted: ["已接单", "st-accepted"], checked: ["已到店核验", "st-checked"], note: ["笔记已交付", "st-note"], done: ["已完成", "st-done"] };
function renderOrders() {
  const page = document.getElementById("page");
  if (!mine.length) {
    page.innerHTML = `<div class="h">我的订单</div>
      <div style="text-align:center;padding:110px 0;color:var(--text2)"><div style="font-size:44px">🧾</div><p style="margin-top:10px">还没有订单<br/>去「发现」领取免费体验单</p></div>`;
    return;
  }
  page.innerHTML = `<div class="h">我的订单</div><div class="ocards">${mine.map((m, i) => {
    const [txt, cls] = ST_TEXT[m.st];
    let act = "";
    if (m.st === "accepted") act = `<button class="btn-act" id="act-${i}" onclick="checkin(${i})">📍 到店核验</button>`;
    if (m.st === "checked") act = `<button class="btn-act" onclick="publish(${i})">✍️ 写笔记</button>`;
    if (m.st === "note") act = `<button class="btn-act ghost" onclick="toast('等待商家互评后完成')">⏳ 互评中</button>`;
    if (m.st === "done") act = `<span class="sub">✅ 已互评完成</span>`;
    return `
      <div class="ocard">
        <div class="otop"><span class="oname">${m.o.emoji} ${m.o.name}</span><span class="ost ${cls}">${txt}</span></div>
        <div class="odesc">${m.o.desc}</div>
        <div class="obottom"><span class="oval">¥${m.o.val}</span>${act}</div>
      </div>`;
  }).join("")}</div>`;
}
function checkin(i) {
  const btn = document.getElementById("act-" + i);
  btn.disabled = true; btn.textContent = "定位核验中…";
  setTimeout(() => { mine[i].st = "checked"; mDone++; renderOrders(); toast("LBS 核验通过：距门店 87m（Tier0 强通过）"); }, 1200);
}
function publish(i) {
  const m = mine[i];
  mine[i].st = "note"; mNote++;
  myNotes.unshift({ id: Date.now(), name: m.o.name + " · 免费体验", sub: "曝光 326 · 刚刚发布", text: "真实体验分享……【广告·免费体验】" });
  renderOrders();

}
function doPublish() {
